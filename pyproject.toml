[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dvdcam-rip"
version = "0.3.0"
description = "Turn DVD camcorder discs (DVD-Video, DVD-VR, unfinalized, ISO) into one MP4 per recording"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dvdcam-rip = "dvdcam_rip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
