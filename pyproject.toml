[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvdcam-rip"
version = "0.4.0"
description = "Turn DVD camcorder discs (DVD-Video, DVD-VR, unfinalized, ISO) into one MP4 per recording"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Cruz" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Gabriel-Mutum/dvdcam-rip"
Issues = "https://github.com/Gabriel-Mutum/dvdcam-rip/issues"

[project.scripts]
dvdcam-rip = "dvdcam_rip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
